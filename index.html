<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Boxed Simple clock</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <div class="clock">
        <div class="container">
          <h2 id="hour">00</h2>
          <h2 class="dot">:</h2>
          <h2 id="minute">00</h2>
          <h2 class="dot">:</h2>
          <h2 id="seconds">00</h2>

          <span id="AmPm">AM</span>
        </div>
      </div>
    </section>

    <footer>
      <div class="right">
        &copy; 2026 Copyright. All Rights Reserved. <br />
        Made by <span>Duskborne</span> and <span>Arhaan</span>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
